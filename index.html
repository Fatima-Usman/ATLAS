<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      background-color: #003876;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
    }

    /* Centered Landing Container */
    .hero-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 2.5rem;
    }

    /* Interactive O-Levels Link Box */
    .olevels-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 5px 10px;
    }

    .compass-icon {
      width: 20px;
      height: 20px;
    }

    .compass-needle {
      transform-origin: 12px 12px;
      transition: transform 0.4s ease-in-out;
    }

    .olevels-text {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      position: relative;
    }

    .olevels-text::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 1.5px;
      bottom: -4px;
      left: 0;
      background-color: #ffffff;
      transition: width 0.3s ease-in-out;
    }

    /* HOVER EFFECTS */
    .olevels-wrapper:hover .compass-needle {
      transform: rotate(90deg);
    }

    .olevels-wrapper:hover .olevels-text::after {
      width: 100%;
    }

    /* Left-aligned subjects & page views */
    .subjects-container {
      min-height: 100vh;
      padding: 4rem 10%;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .subjects-title {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .subject-list {
      list-style: none;
    }

    /* Interactive Subjects Dropdown Item */
    .subjects-toggle-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 5px 0;
      margin-bottom: 0.5rem;
    }

    .subjects-toggle-text {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      position: relative;
    }

    .subjects-toggle-text::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 1.5px;
      bottom: -4px;
      left: 0;
      background-color: #ffffff;
      transition: width 0.3s ease-in-out;
    }

    .subjects-toggle-wrapper:hover .compass-needle {
      transform: rotate(90deg);
    }

    .subjects-toggle-wrapper:hover .subjects-toggle-text::after {
      width: 100%;
    }

    /* Sub-list Indented Dropdown */
    .dropdown-list {
      list-style: none;
      margin-left: 4rem;
      margin-top: 0.5rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dropdown-item {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      opacity: 0.9;
      cursor: pointer;
      width: fit-content;
      position: relative;
    }

    .dropdown-item::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 1.5px;
      bottom: -4px;
      left: 0;
      background-color: #ffffff;
      transition: width 0.3s ease-in-out;
    }

    .dropdown-item:hover::after {
      width: 100%;
    }

    .back-btn {
      color: #ffffff;
      text-decoration: underline;
      margin-bottom: 2rem;
      cursor: pointer;
      display: inline-block;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div id="home" class="hero-container">
    <h1 class="title">ATLAS</h1>
    <p class="subtitle">PREP , MAPPED</p>
    
    <div onclick="showSubjects()" class="olevels-wrapper">
      <svg class="compass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <text x="12" y="0" font-size="5" fill="currentColor" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
        <g class="compass-needle">
          <polygon points="12,5 15,12 12,19 9,12" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </g>
      </svg>
      
      <span class="olevels-text">O-Levels</span>
    </div>
  </div>

  <div id="subjects" class="subjects-container" style="display: none;">
    <a onclick="showHome()" class="back-btn">&larr; Back to Home</a>
    <h2 class="subjects-title">O-Levels</h2>
    
    <ul class="subject-list">
      <li>
        <div onclick="toggleDropdown()" class="subjects-toggle-wrapper">
          <svg class="compass-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <text x="12" y="0" font-size="5" fill="currentColor" text-anchor="middle" font-family="sans-serif" font-weight="bold">N</text>
            <g class="compass-needle">
              <polygon points="12,5 15,12 12,19 9,12" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </g>
          </svg>
          <span class="subjects-toggle-text">Subjects</span>
        </div>

        <ul id="subjects-dropdown" class="dropdown-list">
          <li onclick="showIslamiyat()" class="dropdown-item">Islamiyat (2058)</li>
        </ul>
      </li>
    </ul>
  </div>

  <div id="islamiyat-page" class="subjects-container" style="display: none;">
    <a onclick="showSubjectsFromIslamiyat()" class="back-btn">&larr; Back to O-Levels</a>
    <h2 class="subjects-title">ISLAMIYAT</h2>
  </div>

  <script>
    function showSubjects() {
      document.getElementById('home').style.display = 'none';
      document.getElementById('islamiyat-page').style.display = 'none';
      document.getElementById('subjects').style.display = 'flex';
    }

    function showHome() {
      document.getElementById('subjects').style.display = 'none';
      document.getElementById('islamiyat-page').style.display = 'none';
      document.getElementById('home').style.display = 'flex';
      document.getElementById('subjects-dropdown').style.display = 'none';
    }

    function showIslamiyat() {
      document.getElementById('subjects').style.display = 'none';
      document.getElementById('islamiyat-page').style.display = 'flex';
    }

    function showSubjectsFromIslamiyat() {
      document.getElementById('islamiyat-page').style.display = 'none';
      document.getElementById('subjects').style.display = 'flex';
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('subjects-dropdown');
      if (dropdown.style.display === 'flex') {
        dropdown.style.display = 'none';
      } else {
        dropdown.style.display = 'flex';
      }
    }
  </script>

</body>
</html>
