<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS</title>
  
  <!-- Serif fonts matching the layout design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      background-color: #003876; /* Deep blue theme matching the image */
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .landing-container {
      padding: 2rem;
    }

    /* Main ATLAS Title */
    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    /* Subtitle: PREP, MAPPED */
    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="landing-container">
    <h1 class="title">ATLAS</h1>
    <p class="subtitle">PREP , MAPPED</p>
  </div>

</body>
</html>
